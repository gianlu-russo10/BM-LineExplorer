<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Linea s001 - BM Driver Aid</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #FF5900;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Barra superiore */
    .top-bar {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Bottone Indietro */
    .back-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 2px solid #000;
      border-radius: 8px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      background: #fff;
      width: 10%;
      transition: 0.2s;
    }

    .back-box:hover {
      background: #eaeaea;
    }

    .back-box svg {
      stroke: #000;
    }

    .top-bar h2 {
      margin: 0 auto;
      font-size: 22px;
      color: #000000;
    }

    .line-container {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .line-title {
      font-size: 22px;
      margin: 0;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border: 2px solid #000;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      background: #fff;
      color: #000;
    }

    .main-hr {
      border: none;
      border-top: 2px solid #000;
      margin: 20px 0 30px 0;
    }

    .schema-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    svg {
      width: 450px;
      transform: scale(1);
      transform-origin: top left;
    }

    h4 {
      margin: 20px 0 10px 0;
      font-size: 18px;
      color: #000;
    }

    .block-hr {
      border: none;
      border-top: 2px solid #000;
      margin: 15px 0 25px 0;
    }
  </style>
</head>

<body>

  <!-- Barra superiore -->
  <div class="top-bar">

    <!-- Bottone Indietro -->
    <div class="back-box" onclick="window.location.href='linee.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Indietro
    </div>

    <!-- Titolo centrato -->
    <h2>Bike Mobility - Driver Aid</h2>

  </div>


  <div class="line-container">

    <!-- Titolo con badge -->
    <h3 class="line-title">
      <span class="badge">s001</span>
      Codogno - Retegno - La Costa - Fombio
    </h3>

    <hr class="main-hr">

    <!-- ===================== -->
    <!-- BLOCCO A -->
    <!-- ===================== -->
    <h4>Codogno FS - Retegno - La Costa - Fombio Municipio</h4>

    <div class="schema-wrapper">
      <svg viewBox="0 0 600 900">
        <line x1="100" y1="60" x2="100" y2="865" stroke="#FF5900" stroke-width="10" />

        <circle cx="100" cy="60"  r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="65">CODOGNO FS</text>

        <circle cx="100" cy="140" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="145">CODOGNO VALM</text>

        <circle cx="100" cy="220" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="225">CODOGNO - Fiera</text>

        <circle cx="100" cy="300" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="305">RETEGNO - P.za Diaz</text>

        <circle cx="100" cy="380" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="385">Retegno</text>

        <circle cx="100" cy="460" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="465">FOMBIO - Via Boccaserio/Via Vespucci</text>

        <circle cx="100" cy="540" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="545">FOMBIO - LA COSTA Via Vespucci/Parco Giochi</text>

        <circle cx="100" cy="620" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="625">FOMBIO - Via Boccaserio/Via Papa Giovanni</text>

        <circle cx="100" cy="700" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="705">FOMBIO - Via Piantada/Laghetto</text>

        <circle cx="100" cy="780" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="785">FOMBIO - Via delle Viole/Via dei Fiordalisi</text>
        
        <circle cx="100" cy="860" r="10" fill="#fff" stroke="#FF5900" stroke-width="4" />
        <text x="120" y="865">FOMBIO - Via Roma/Municipio</text>
        
      </svg>
    </div>

    
  </div>

</body>
</html>
